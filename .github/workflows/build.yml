name: Build Standalone Executables

# Triggers:
#   - Every push to main (CI: verify the build still works)
#   - Every version tag (v1.0, v1.2.3, …) → CI build + GitHub Release with binaries
#   - Manual trigger via GitHub UI (Actions → Run workflow)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: test   # only build if all tests pass
    strategy:
      fail-fast: false   # build all platforms even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: pegelanalyse-linux
            exe-path: dist/pegelanalyse
            release-name: pegelanalyse-linux

          - os: windows-latest
            artifact-name: pegelanalyse-windows
            exe-path: dist/pegelanalyse.exe
            release-name: pegelanalyse-windows.exe

          - os: macos-latest
            artifact-name: pegelanalyse-macos
            exe-path: dist/pegelanalyse
            release-name: pegelanalyse-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller pegelanalyse.spec

      - name: Rename executable for release
        shell: bash
        run: mv "${{ matrix.exe-path }}" "dist/${{ matrix.release-name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.release-name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pegelanalyse-linux
            artifacts/pegelanalyse-windows.exe
            artifacts/pegelanalyse-macos
